# XcodeGen 工程描述文件
# 在 Mac 上安装 XcodeGen 后，在本目录执行 `xcodegen generate` 即可生成 MediaManager.xcodeproj
# 也可以完全不用 XcodeGen：新建一个 iOS App 工程，把 MediaManager/ 目录整个拖进去即可
name: MediaManager
options:
  bundleIdPrefix: com.baii666
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  MediaManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediaManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baii666.mediamanager
        # 1=iPhone, 2=iPad, "1,2"=通用（通用便于在 iPhone 模拟器上调试；iPad 上体验不变）
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: MediaManager/Info.plist
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
