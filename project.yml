# XcodeGen 工程描述文件
# 在 Mac 上安装 XcodeGen 后，在本目录执行 `xcodegen generate` 即可生成 MediaManager.xcodeproj
# 也可以完全不用 XcodeGen：新建一个 iOS App 工程，把 MediaManager/ 目录整个拖进去即可
name: MediaManager
options:
  bundleIdPrefix: com.baii666
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  MediaManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediaManager
    settings:
      base:
        # 必填：缺失会让模拟器安装时报 "missing bundle id"
        PRODUCT_BUNDLE_IDENTIFIER: com.baii666.mediamanager
        PRODUCT_NAME: MediaManager
        # 1=iPhone, 2=iPad, "1,2"=通用
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: MediaManager/Info.plist
        # 关掉 Xcode 的自动 plist 合成，否则会忽略上面的 INFOPLIST_FILE，
        # 导致 Info.plist 里的 $(PRODUCT_BUNDLE_IDENTIFIER) 展开成空
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
